[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    Servo
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    teckel12/NewPing @ ^1.9.7
    knolleary/PubSubClient @ ^2.8
    yasheena/TelnetSpy

# === USE THIS WHEN PLUGGED INTO USB ===
[env:nodemcuv2_usb]
upload_protocol = esptool
upload_port = COM4
upload_speed = 115200

# === USE THIS FOR WIRELESS COUCH FLASHING ===
[env:nodemcuv2_ota]
upload_protocol = espota
upload_port = 192.168.30.111